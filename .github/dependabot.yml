version: 2
updates:
  - package-ecosystem: github-actions
    # The actions live in subfolders, which "/" alone doesn't cover
    directories:
      - /claude-review/code
      - /claude-review/security
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
