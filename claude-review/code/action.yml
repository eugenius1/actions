name: Claude code review
description: Runs the code-review plugin's /code-review on the current PR and posts findings as inline comments.

inputs:
  claude_code_oauth_token:
    description: The repo's CLAUDE_CODE_OAUTH_TOKEN secret
    required: true

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        # Use the plugin's /code-review, not the built-in one, so that the
        # findings are posted as inline comments (confirmed: true).
        plugin_marketplaces: https://github.com/anthropics/claude-code.git
        plugins: code-review@claude-code-plugins
        # The plugin stops on a PR Claude has commented on, which would leave
        # every push after the first unreviewed
        prompt: |
          /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

          This run reviews head commit ${{ github.event.pull_request.head.sha }}.
          In step 1, tell the eligibility agent to leave out the "Claude has
          already commented" check: an earlier Claude comment is about an earlier
          commit. Still don't post an issue that an earlier Claude comment on
          this PR already raised.
        # Show what Claude did in the job summary, so a run that posts nothing
        # can be told apart from one that found nothing. Only same-repo PRs
        # run this, so the content it echoes is trusted.
        display_report: true
        claude_args: >-
          --allowedTools
          "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
